    <!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Fly</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="style.css"></head><body>
<div id="app">
<nav id="side"><div class="logo"><svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="24" fill="#2bdc6b"/><path d="M8 29l7-1 3-8c2-5 8-7 13-4l6-2-3 5c1 9-5 17-14 17-5 0-9-2-12-7z" fill="#0b0d0c"/><circle cx="31" cy="19" r="1.6" fill="#2bdc6b"/></svg>Fly</div>
<button class="nav" data-v="home" onclick="go('home')">Home</button><button class="nav" data-v="search" onclick="go('search')">Search</button><button class="nav" data-v="library" onclick="go('library')">Your Library</button><button class="nav ai" data-v="mood" onclick="go('mood')">✦ Fly AI</button></nav>
<main id="main"><div id="mc"></div></main>
<div id="pb"><div id="pi" onclick="fs(1)"></div>
<div><div class="ctl"><button class="ib" id="sh" onclick="shuf=!shuf;upd()" title="Shuffle">⇄</button><button class="ib" onclick="prev()" title="Previous">⏮</button><button class="pp" id="pp" onclick="tog()" title="Play/pause">▶</button><button class="ib" onclick="next()" title="Next">⏭</button><button class="ib" id="rp" onclick="rep=(rep+1)%3;upd()" title="Repeat">↻</button></div>
<div class="sk"><span id="t0">0:00</span><input type="range" id="sk" step="0.1" min="0" max="100" value="0" oninput="seekTo(+this.value)"><span id="t1">0:00</span></div></div>
<div id="pr"><button class="ib" onclick="fs(1)" title="Lyrics">♫</button><button class="ib" onclick="qo(1)" title="Queue">☰</button></div></div>
</div>
<div class="ov" id="np"><canvas id="gl"></canvas><button class="ib x" onclick="fs(0)">✕</button>
<div id="npi"><div id="npc"></div><div><div class="eq"><i></i><i style="animation-delay:-.3s"></i><i style="animation-delay:-.6s"></i><i style="animation-delay:-.2s"></i><i style="animation-delay:-.8s"></i><i style="animation-delay:-.45s"></i></div><div id="ly"></div></div></div></div>
<div class="ov" id="qp"><button class="ib x" onclick="qo(0)">✕</button><div id="qb"></div></div>
<div class="ov md" id="md"><div id="mb"></div></div><div id="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script><script src="https://cdn.jsdelivr.net/npm/lenis@1.1.13/dist/lenis.min.js"></script>
