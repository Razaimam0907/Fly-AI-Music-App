<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Fly</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="style.css"></head><body>
<div id="app">
<header id="top"><button class="hb" onclick="menu(1)" aria-label="Open menu"><span></span><span></span><span></span></button><div class="logo" onclick="go('home')"><svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="24" fill="#2bdc6b"/><path d="M8 29l7-1 3-8c2-5 8-7 13-4l6-2-3 5c1 9-5 17-14 17-5 0-9-2-12-7z" fill="#0b0d0c"/><circle cx="31" cy="19" r="1.6" fill="#2bdc6b"/></svg>Fly</div><div class="tsw"><span>⌕</span><input type="text" id="ts" placeholder="Search songs, artists, movies, lyrics…" oninput="topSearch(this.value)" autocomplete="off" aria-label="Search"></div><button class="av" id="av" onclick="menu(1)" aria-label="Profile">G</button></header>
<nav id="side">
<button class="nav" data-v="home" onclick="go('home')">Home</button><button class="nav" data-v="search" onclick="go('search');$('#ts').focus()">Search</button><button class="nav" data-v="library" onclick="go('library')">Your Library</button><button class="nav ai" data-v="mood" onclick="go('mood')">✦ Fly AI</button><button class="nav gold" data-v="premium" onclick="openPre()">★ Premium</button></nav>
<main id="main"><div id="mc"></div></main>
<div id="pb"><div id="pi" onclick="fs(1)"></div>
<div id="pm"><div class="ctl"><button class="ib" id="sh" onclick="shuf=!shuf;upd()" title="Shuffle">⇄</button><button class="ib" onclick="prev()" title="Previous">⏮</button><button class="pp" id="pp" onclick="tog()" title="Play/pause">▶</button><button class="ib" onclick="next()" title="Next">⏭</button><button class="ib" id="rp" onclick="rep=(rep+1)%3;upd()" title="Repeat">↻</button></div>
<div class="sk"><span id="t0">0:00</span><input type="range" id="sk" step="0.1" min="0" max="100" value="0" oninput="seekTo(+this.value)"><span id="t1">0:00</span></div></div>
<div id="pr"><button class="ib" onclick="fs(1)" title="Lyrics">♫</button><button class="ib" onclick="qo(1)" title="Queue">☰</button></div></div>
</div>
<div class="ov" id="dr" onclick="if(event.target.id=='dr')menu(0)"><aside id="dp" aria-label="Menu"><div class="dh"><div class="logo" style="padding:0;font-size:24px"><svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="24" fill="#2bdc6b"/><path d="M8 29l7-1 3-8c2-5 8-7 13-4l6-2-3 5c1 9-5 17-14 17-5 0-9-2-12-7z" fill="#0b0d0c"/><circle cx="31" cy="19" r="1.6" fill="#2bdc6b"/></svg>Fly</div><button class="ib" onclick="menu(0)" aria-label="Close menu">✕</button></div><div class="prof" onclick="profile()" style="cursor:pointer"><div class="av big" id="dav">G</div><div><b id="dn">Guest</b><small id="dpl" style="display:block">Free plan</small></div></div><button class="di" style="--i:0" onclick="profile()">👤 Profile</button><button class="di" style="--i:1" onclick="dgo('library')">♥ Liked songs</button><button class="di" style="--i:2" onclick="dgo('library')">☰ Your library</button><button class="di" style="--i:3" onclick="dgo('mood')">✦ Fly AI</button><button class="di pre" style="--i:4" onclick="openPre()">★ Premium</button><button class="di" style="--i:5" onclick="settings()">⚙ Settings</button></aside></div>
<div class="ov" id="np"><canvas id="gl"></canvas><button class="ib x" onclick="fs(0)">✕</button>
<div id="npi"><div id="npl"><div id="npc"></div><div id="npb"><div class="sk"><span id="t2">0:00</span><input type="range" id="sk2" step="0.1" min="0" max="100" value="0" oninput="seekTo(+this.value)" aria-label="Seek"><span id="t3">0:00</span></div><div class="nctl"><button class="ib" id="sh2" onclick="shuf=!shuf;upd()" title="Shuffle">⇄</button><button class="ib" onclick="prev()" title="Previous">⏮</button><button class="pp" id="pp2" onclick="tog()" title="Play/pause">▶</button><button class="ib" onclick="next()" title="Next">⏭</button><button class="ib" id="rp2" onclick="rep=(rep+1)%3;upd()" title="Repeat">↻</button></div><div class="lsync"><span>Lyrics sync</span><button onclick="lo(-10)">−10s</button><button onclick="lo(-1)">−1s</button><button onclick="lo(1)">+1s</button><button onclick="lo(10)">+10s</button></div></div></div><div id="npr"><div class="eq"><i></i><i style="animation-delay:-.3s"></i><i style="animation-delay:-.6s"></i><i style="animation-delay:-.2s"></i><i style="animation-delay:-.8s"></i><i style="animation-delay:-.45s"></i></div><div id="lw"><div id="ly"></div></div></div></div></div>
<div class="ov" id="qp"><button class="ib x" onclick="qo(0)">✕</button><div id="qb"></div></div>
<div class="ov md" id="md"><div id="mb"></div></div><div id="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script><script src="https://cdn.jsdelivr.net/npm/lenis@1.1.13/dist/lenis.min.js"></script>
<script src="app.js"></script></body></html>
